    <!-- Content-Security-Policy: linha de base para um site estático sem
         backend. script-src fica travado em 'self' (sem inline/eval);
         style-src precisa de 'unsafe-inline' porque a UI é animada via
         atributo style (Framer Motion) e carrega a folha de estilo do
         Google Fonts. Se um formulário real (Formspree, EmailJS etc.) for
         conectado depois, adicione o domínio dele a connect-src. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    />
